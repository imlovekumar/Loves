<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280">
  <title>Tatkal Booking Interface</title>
  <link rel="icon" type="image/x-icon" href="https://client.prs/assets/images/logos/indian_railways_logo.png">
  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system,BlinkMacSystemFont, "segoe UI",Roboto, Helvetica,Arial,sans-serif;
     }

    body {
      background: #eef2f7;
      background-color: #f4f4f6;
      padding: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
    }

.booking-container {
  width: 100%;
  max-width: 60%;
  margin-top: 20px;
  background-color: #fbf8fa;
  border: 1px solid #dcd1db;
  border-radius: 4px;
  overflow: hidden;
  box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2), 0 6px 20px 0 rgba(0,0,0,0.19);
}

.main-header {
  display: flex;
  flex-direction: row;
  position: relative;
  background-color: #f3eef4;
  padding: 8px 16px;
  color: #0f1c5d;
  font-weight: bold;
  font-size: 14px;
}

.button-Area {
  max-width: 100%;
  padding: 12px;
  display: grid;
  place-items: center;
  grid-template-columns: 1fr 1fr 1fr;
  background-color: #f3eef4;
}

.journey-info-bar {
  display: grid;
  grid-template-columns:  minmax(0,4fr) minmax(0,4fr) minmax(0,5fr) minmax(0,6fr) minmax(0,5fr);
  background-color: #ffffff;
  border-bottom: 1px solid #e2e8f0;
  padding: 12px 16px;
  gap: 10px;
}

.journey-info-bar2 {
  display: grid;
  grid-template-columns: minmax(0,5fr) minmax(0,5fr) minmax(0,5fr) minmax(0,5fr);
  background-color: #ffffff;
  padding: 12px 16px;
  gap: 10px;
}

.extras-info-bar {
  display: grid;
  grid-template-columns: .8fr 1.2fr 1fr;
  background-color: #ffffff;
  padding: 12px 16px;
  gap: 10px;
}

.info-block {
  display: flex;
  flex-direction: column;
}

.info-label {
  display: flex;
  flex-direction: row;
  position: relative;
  padding: 3px;
  font-size: 10px;
  color: #1a365d;
  font-weight: bold;
  text-transform: uppercase;
  margin-bottom: 4px;
  height: 16px;
  place-items: center;
}

.switch {
  position: relative;
  width: 26px;
  height: 16px;
  margin-right: 6px;
}

.switch input {
  display: none;
}

.slider {
  position: absolute;
  inset: 0;
  background: #d1d5db;
  border-radius: 50px;
  cursor: pointer;
  transition: .25s;  
}

.slider::before{
  content: "";
  position: absolute;
  width: 10px;
  height: 10px;
  left: 3px;
  top: 3px;
  background: #fff;
  border-radius: 50%;
  box-shadow: 0 2px 6px rgba(0,0,0,.2);
  transition: .25s;
}

.switch input:checked + .slider{
  background: #2563eb;  
}

.switch input:checked + .slider::before {
  transform: translateX(9px);
}

.passenger-section {
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.passenger-row {
  display: flex;
  background-color: #f7fafc;
  border: 1px solid #e2e8f0;
  border-radius: 4px;
  overflow: hidden;
  align-items: stretch;
  box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2), 0 6px 20px 0 rgba(0,0,0,0.19);
}

.duty-pass-row {
  grid-column: 1/-1;
  grid-template-columns: repeat(4,1fr);
  gap: 10px;
  display: none;
}

.passenger-index {
  background-color: #ffffff;
  border-right: 1px solid #e2e8f0;
  padding: 10px 6px;
  font-size: 11px;
  font-weight: bold;
  color: #2d3748;
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  text-align: center;
  white-space: nowrap;
  box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2), 0 6px 20px 0 rgba(0,0,0,0.19);
}

.passenger-inputs {
  display: grid;
  grid-template-columns: minmax(0,5.5fr) minmax(0,3fr) minmax(0,2.5fr) minmax(0,4.5fr) minmax(0,4.5fr);
  gap: 12px;
  padding: 10px;
  width: 100%;
  align-items: center;
}

.input-group {
  display: flex;
  flex-direction: column;
  position: relative;
}

.mobile-input {
  display: flex;
  flex-direction: row;
  position: relative;
}

.form-control {
  width: 100%;
  border: none;
  border-bottom: 1px solid #a0aec0;
  background: transparent;
  padding: 4px 4px;
  font-size: 13px;
  color: #2d3748;
  outline: none;
}

.form-control:focus {
  border-bottom: 1px solid red;
}

select.form-control {
  appearance: none;
  background-repeat: no-repeat;
  background-position: right 4px center;
  padding-right: 16px;
}

.name-input::placeholder {
  color: #a0aec0;
}

.modern-btn {
  width: 82%;
  height: 46px;
  border: 1px solid #d8dce6;
  border-radius: 12px;
  background: linear-gradient(180deg,#ffffff,#f5f7fb);
  color: #1e3a5f;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.5px;
  cursor: pointer;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: all .25s ease;
  box-shadow: 0 2px 8px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.9);
}

.modern-btn:hover {
  transform: translateY(-2px);
  background: linear-gradient(180deg,#ffffff,#eef4ff);
  border-color: #2563eb;
  color: #2563eb;
  box-shadow: 0 8px 18px rgba(37,99,235,0.20);
}

.modern-btn:active {
  transform: translateY(1px) scale(.98);
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.15);
}

.modern-btn:focus {
  outline: none;
  border-color: #2563eb;
  box-shadow: 0 0 0 4px rgba(37,99,235,0.15);
}


#bookmarkLink {
  width: 82%;
  height: 46px;
  display: flex;
  justify-content: center;
  align-items: center;
  border-radius: 12px;
  border: 1px dashed #2563eb;
  background: #eef5ff;
  color: #1e3a5f;
  font-size: 15px;
  font-weight: 600;
  text-decoration: none;
  transition: all .25s ease;  
}

#bookmarkLink:hover {
  background: #2563eb;
  color: #fff;
  border-style: solid;
  transform: translateY(-2px);
  box-shadow: 0 8px 18px rgba(37,99,235,0.25);
}

#bookmarkLink::active {
  transform: scale(.98);
}


#bookmarkLink[draggable="true"] {
  background-color: #007bff;
  font-weight: bold;
  cursor: grab;
}

#outputBox {
  display: none;
  border: 1px solid #ccc;
  border-radius: 4px;
  padding: 10px;
  width: 60%;
  max-width: 1200px;
  background-color: #f9f9f9;
  margin-top: 15px;
}

summary {
  font-weight: bold;
  cursor: pointer;
}

textarea {
  width: 100%;
  height: 100px;
  margin-top: 10px;
  box-sizing: border-box;
}

.jour-container {
  display: flex;
  width: 100%;
  border: none;
  overflow: hidden;
  border-bottom: 1px solid #e2e8f0;
  border-top: 1px solid #e2e8f0;
}

.left {
  padding: 10px 6px;
  font-size: 11px;
  font-weight: bold;
  color: #2d3748;
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  text-align: center;
  white-space: nowrap;
  border-left: 1px solid #e2e8f0;
  box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2), 0 6px 20px 0 rgba(0,0,0,0.19);
}

.right {
  flex:1;
  display: flex;
  max-width: 100%;
  flex-direction: column;
}

#page {
  transition: .45s;
}
body.locked #page {
  filter: blur(2px);
  user-select: none;
  pointer-events: none;
}

#overlay {
  position: fixed;
  background: rgba(0,0,0,.35);
  border-radius: 22px;
  backdrop-filter:blur(2px);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 99999;
  transition: .35s;
}

body.unlocked #overlay {
  opacity: 0;
  visibility: hidden;
}

.lock-box {
  width: 360px;
  padding: 30px;
  border-radius: 22px;
  background: rgba(255,255,255,.18);
  border: 1px solid rgba(255,255,255,.35);
  backdrop-filter:blur(20px);
  box-shadow: 0 20px 60px rgba(0,0,0,.25);
  text-align: center;
  animation: popup .45s ease;
}

@keyframes popup{
  from {
    transform: translateY(30px) scale(.9);
    opacity: 0;
  }
  to{
    transform: none;
    opacity: 1;
  }
}

.lock-icon{
  font-size: 60px;
  margin-bottom: 15px;
}

h2{
  color: white;
  margin-bottom: 25px;
  font-weight: 600; 
}

#password{
  width: 100%;
  height: 48px;
  border: none;
  outline: none;
  border-radius: 12px;
  padding: 0 16px;
  font-size: 16px;
  background: white;
  margin-bottom: 18px; 
}

#login-btn {
  width: 100%;
  height:48px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  color: white;
  font-size: 16px;
  font-weight: 600;
  transition: .25;
  background: linear-gradient(135deg,#0078ff,#00b4ff);
}

#login-btn:hover {
  transform: translateY(-2);
  box-shadow: 0 10px 25px rgba(0,120,255,.35);
}

#error{
  margin-top: 14px;
  color: red;
  height: 18px;
  font-size: 14px;
}

.shake{
  animation: .35s;
}

@keyframes shake {
  10%{transform: translateX(-8px);}
  20%{transform: translateX(8px);}
  30%{transform: translateX(-8px);}
  40%{transform: translateX(8px);}
  50%{transform: translateX(-6px);}
  60%{transform: translateX(6px);}
  70%{transform: translateX(-4px);}
  80%{transform: translateX(4px);}
  100%{transform: none;}
}

body.unlocked .logout-btn{
  display: block;
}

.logout-btn{
  display: none;
  margin-left: auto;
  background: none;
  border: none;
  padding: 0;
  color: black;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  transition: .2s;
}

.logout-btn:hover{
  transform: translateY(-2px);
  box-shadow:0 12xp 25px rgba(255,0,0,.35);
}
</style>
</head>
<body class="locked">

<div class="booking-container" id="page">
  <div class="main-header">KONDAPURAM BOOKING FORM
  <button class="logout-btn" onclick="logout()">&#x1F512;</button>
  </div>
  <div class="jour-container">
    <div class="left">Journey Details</div>
    <div class="right">
    <div class="journey-info-bar">
    <div class="info-block">
      <span class="info-label">Form No.</span>
      <div class="input-group">        
        <select class="form-control" id="bookmarkName" onchange="updateButtonText()">
          <option>Form 1</option>
          <option>Form 2</option>
          <option>Form 3</option>
          <option>Form 4</option>
          <option>Form 5</option>
          <option>Form 6</option>
          <option>Form 7</option>
          <option>Form 8</option>
          <option>Form 9</option>
          <option>Form 10</option>
        </select>
      </div>
    </div>
    <div class="info-block">
      <span class="info-label">Train No.</span>
      <div class="input-group">
          <input
            class="form-control"
            type="number"
            id="trainNumber"
            placeholder="Train No"
            maxlength="5"
            pattern="[0-9]{5}"
            oninput="this.value = this.value.replace(/\D/g, '').slice(0, 5)"
            required>
      </div>
    </div>
    <div class="info-block">
      <span class="info-label">Date of Joruney</span>
      <div class="input-group">
      <input
            type="text"
            id="date"
            class="form-control"
            placeholder="Journey Date"
            maxlength="10"
            oninput="formatDate(this)"
            required>
     </div>
    </div>  
    <div class="info-block">
      <span class="info-label">From Station</span>
        <div class="input-group">
          <input class="form-control"
            type="text"
            id="source"
            placeholder="Source Code"
            maxlength="6"
            oninput="
                    this.value = this.value.replace(/[^A-Za-z]/g,'');
                    this.value = this.value.toUpperCase();
                    document.getElementById('brdStn').value = this.value;"
            required>
        </div>
    </div> 
    <div class="info-block">
      <span class="info-label">To Station</span>
        <div class="input-group">
          <input class="form-control"
            type="text"
            id="destination"
            placeholder="Destination Code"
            maxlength="6"
            oninput="
                    this.value = this.value.replace(/[^A-Za-z]/g,'');
                    this.value = this.value.toUpperCase();"
            required>
        </div>
    </div>
</div>
<div class="journey-info-bar2">
  <div class="info-block">
    <span class="info-label">Journey Class</span>
      <div class="input-group"> 
        <select class="form-control" id="coach">
          <option>SL - SLEEPER</option>          
          <option>3A - THIRD AC</option>
          <option>3E - THIRD AC ECONOMY</option>
          <option>2A - SECOND AC</option> 
          <option>1A - FIRST AC</option>
        </select>
      </div>
   </div>
   
   <div class="info-block">
    <span class="info-label">No. of Passenger</span>
      <div class="input-group"> 
        <select class="form-control" id="count" onchange="createPassRows()">
          <option>1</option>
          <option>2</option>
          <option>3</option>
          <option>4</option>
          <option>5</option>
          <option>6</option>
        </select>
      </div>
    </div>
    <div class="info-block">
     <span class="info-label">
        <label class="switch">
          <input type="checkbox" id="quotaToggle">
          <span class="slider"></span>
        </label>Quota
      </span>
      <div class="input-group"> 
        <select id="quota" class="form-control" disabled>
          <option>TQ - TATKAL</option>
          <option>PT - PREMIUM TATKAL</option>
          <option>GN - GENERAL</option>
          <option>DP - DUTY PASS</option>
        </select>
      </div>
   </div>
    <div class="info-block">
      <span class="info-label">
        <label class="switch">
          <input type="checkbox" id="brdStnToggle">
          <span class="slider"></span>
        </label>Boarding Station
      </span>
        <div class="input-group"> 
          <input class="form-control"
            type="text"
            id="brdStn"
            placeholder="Boarding Station"
            disabled>
        </div>
    </div>
</div></div></div>

<div id="passArea" class="passenger-section"></div>

<div class="jour-container">
    <div class="left">Extras</div>
    <div class="right">
    <div class="extras-info-bar">

    <div class="info-block">
      <span class="info-label">Payment Mode</span>
       <div class="input-group">
        <select class="form-control" id="payment">
          <option>Cash</option>
          <option>UPI/BHIM QR</option>
        </select>
      </div>
  </div>
  <div class="info-block">
      <span class="info-label">10 Digit Mobile</span>
      <div class="mobile-input">
        <input
          type="number"
          class="form-control"
          id="mobile"
          placeholder="Mobile Number"
          maxlength="10"
          oninput="this.value = this.value.replace(/\\D/g,'').slice(0, 10)">
      </div>
  </div>
  <div class="info-block">
    <div class="input-group">
      <span class="info-label">
        <label class="switch">
          <input type="checkbox" id="coachToggle">
          <span class="slider"></span>
        </label>Coach No
      </span>
          <input
            type="text"
            class="form-control"
            id="wagon"
            placeholder="Coach No."
            maxlength="4"
          disabled>
    </div>  
  </div>
</div></div></div>

  <div id="buttonArea" class="button-Area">
    <button class="modern-btn" onclick="generate()">Save</button>
    <button class="modern-btn" onclick="clearAll()">Reset</button>
    <a id="bookmarkLink" href="#" draggable="false"></a>
  </div>
</div>


<details id="outputBox">
  <summary>Click Here To CHeck Details</summary>
    <div class="textarea-container">
      <textarea id="output"></textarea>
    </div>
</details>

<div id="overlay">
  <div class="lock-box" id="box">
    <div class="lock-icon">&#128274;</div>
      <h2>Protected Page</h2>
      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="off">

      <button id="login-btn" onclick="unlock()">Unlock</button>
    <div id="error"></div>
  </div>
</div>


<script>

const PASSWORD="KDPRS";
const input=document.getElementById("password");
input.focus();      

input.addEventListener("keydown",e=>{
  if(e.key==="Enter")
  unlock();
});

function unlock() {
  const value=input.value;
  if(value===PASSWORD) {
    document.body.classList.remove("locked");
    document.body.classList.add("unlocked");
    document.getElementById("trainNumber").focus();
  }
  else {
    document.getElementById("error").innerText="Incorrect Password";
    const box=document.getElementById("box");
    box.classList.remove("shake");
    void box.offsetWidth;
    box.classList.add("shake");
    input.select();
  }
}

function logout() {
  clearAll();
  document.body.classList.remove("unlocked");
  document.body.classList.add("locked");
  const input=document.getElementById("password");
  input.value="";
  setTimeout(() => {
    input.focus();
  },350);
  document.getElementById("error").innerText ="";

}

const coachToggle = document.getElementById("coachToggle"); 
const wagonInput = document.getElementById("wagon"); 
const brdStnToggle = document.getElementById("brdStnToggle"); 
const brdStnInput = document.getElementById("brdStn"); 
const quotaToggle = document.getElementById("quotaToggle"); 
const quotaInput = document.getElementById("quota"); 

quotaToggle.addEventListener("change", () => {
  if(quotaToggle.checked) {
    quotaInput.disabled = false;
  } else {
    quotaInput.disabled = true;
  }
});

coachToggle.addEventListener("change", () => {
  if(coachToggle.checked) {
    wagonInput.disabled = false;
  } else {
    wagonInput.value = "";
    wagonInput.disabled = true;
  }
});

brdStnToggle.addEventListener("change", () => {
  if(brdStnToggle.checked) {
    brdStnInput.disabled = false;
  } else {
    brdStnInput.value = "";
    brdStnInput.disabled = true;
  }
});

function toggleFood(toggle) {
  const checked = toggle.checked;
  document.querySelectorAll(".food-toggle").forEach(cb => {
    cb.checked = checked;
  });
  document.querySelectorAll(".food").forEach(select => {
    select.disabled = !checked;
    if(!checked) {
      select.selectedIndex = 0;
    }
  });
}

document.addEventListener("focusin", function(e){
  if(e.target.classList.contains("berth")) {
    e.target.dataset.previous = e.target.value;
  }
});

document.addEventListener("change", function (e) {
  if(!e.target.classList.contains("berth")) return;
  
  const berths = [...document.querySelectorAll("#passArea .berth")];
  const lbCount = berths.filter(s => s.value === "Lower (LB)").length;
  if(lbCount > 2) {
    e.target.value = e.target.dataset.previous || "No Preference";
  }
});

const quota = document.getElementById("quota");
function toggleDutyPassRows() {
  document.querySelectorAll(".duty-pass-row").forEach(row => {
    row.style.display = (quota.value === "DP - DUTY PASS") ? "grid" : "none";
  });
}
quota.addEventListener("change",toggleDutyPassRows);

document.addEventListener("DOMContentLoaded", function(){
  createPassRows();
  setTomorrowDate();
  updateButtonText();
});

function updateButtonText() {
  var select = document.getElementById("bookmarkName");
  var button = document.getElementById("bookmarkLink");
  var selectedText = select.options[select.selectedIndex].text;
  button.textContent = selectedText;
}

function createPassRows() {
  let n = parseInt(document.getElementById("count").value);
  let div=document.getElementById("passArea");
  div.innerHTML="";
  if(isNaN(n) || n<1 ) return;
  let htmlRows = [];
  for(let i=1;i<=n;i++) {
    htmlRows.push(`
      <div class="passenger-row">
        <div class="passenger-index">Psgn #0${i}</div>
          <div class="passenger-inputs">
            <div class="input-group">
              <span class="info-label">Passenger Name</span>
                <input
                  type="text"
                  class="form-control name-input name"
                  placeholder="Name"
                  minlength="3"
                  maxlength="16"
                  oninput="
                      this.value = this.value.replace(/[^A-Za-z ]/g,'');
                      this.value = this.value.toUpperCase();
                      this.value = this.value.replace(/ {2,}/g, ' ');"
                  required>
            </div>
            <div class="input-group">
              <span class="info-label">Gender</span>
                <select class="form-control gender">
                  <option>Male</option>
                  <option>Female</option>
                </select>
            </div>
            <div class="input-group">
              <span class="info-label">Age</span>
                <input
                  type="number"
                  class="form-control age"
                  placeholder="Age"
                  min="1"
                  max="125"
                  required
                  oninput="
                    if(this.value > 125) this.value=125;
                    if(this.value < 1 && this.value !== '') this.value=1;">
            </div>
            <div class="input-group">
              <span class="info-label">Berth Preference</span>
              <select class="form-control berth">
                <option>No Preference</option>
                <option>Lower (LB)</option>
                <option>Middle (MB)</option>
                <option>Upper (UB)</option>
                <option>Side Lower (SL)</option>
                <option>Side Upper (SU)</option>
              </select>
            </div>
            <div class="input-group">
              <span class="info-label">
                <label class="switch">
                  <input
                    type="checkbox"
                    class="food-toggle"
                    onchange="toggleFood(this)">
                  <span class="slider"></span>
                </label>Food
              </span>
                  <select class="form-control food" disabled>
                    <option>D- Denied</option>
                    <option>V- Veg</option>

function setTomorrowDate()  {
  const today = new Date();
  const tomorrow = new Date(today.getTime() + 24 * 60 * 60 * 1000);
  const ist = tomorrow.toLocaleDateString('en-IN', {
    timeZone: 'Asia/Kolkata',
      year: 'numeric',
      month: '2-digit',
      day: '2-digit'
  });

  const time = parseInt(
    tomorrow.toLocaleTimeString('en-IN', {
        timeZone: 'Asia/Kolkata',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
    }).replace(':', ''),
    10
  );
  const coach = document.getElementById("coach");
  if (time >= 900 && time < 1000)
      coach.value = "3A - THIRD AC";
  else if (time >= 1015 && time < 1100)
      coach.value = "SL - SLEEPER";

  const [day,month,year]=ist.split("/");
  const formattedDate = `${day}.${month}.${year}`;
  
  document.getElementById("date").value = formattedDate;
}

function formatDate(input) {
  let value = input.value.replace(/\D/g, "").substring(0, 8);
  let formatted = "";
  if (value.length > 0)
    formatted += value.substring(0, 2);
  if (value.length > 2)
    formatted += "." + value.substring(2, 4);
  if (value.length > 4)
    formatted += "." + value.substring(4, 8);
  input.value = formatted;
}

  document.querySelectorAll("input").forEach(input => {
    if(input.type === "checkbox" || input.type === "radio") {

  document.querySelectorAll("select").forEach(select => {
