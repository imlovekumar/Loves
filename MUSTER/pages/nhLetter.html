<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>NH Preview</title>

<!-- =========================================================
     BASIC A4 PAGE CSS
========================================================= -->
		<style>
			* {
			    box-sizing: border-box;
			}
			html,
			body {
			    margin: 0;
			    padding: 0;
			    min-height: 100%;
			    font-family: Arial, sans-serif;
			    background: #e5e5e5;
			}
			
			/* =========================================================
			   TOP BAR
			========================================================= */
			.top-bar {
    height: 100px;
    background: #222;
    display: flex;
    align-items: center;
    padding: 0 12px;
    position: sticky;
    top: 0;
    z-index: 100;
}

.top-bar button {
    border: none;
    background: #fff;
    color: #222;
    padding: 9px 16px;
    border-radius: 6px;
    font-size: 26px;
    cursor: pointer;
	margin-left: 50px;
	margin-right: 50px;
}

.top-bar button:last-child {
    margin-left: auto;
}

.top-bar button:active {
    transform: scale(0.96);
}
			
			/* =========================================================
			   PAPER AREA
			========================================================= */
			.paper-container {
			    width: 100%;
			    overflow-x: auto;
			    overflow-y: visible;
			    padding: 20px;
			}
			/* =========================================================
			   A4 PAPER
			========================================================= */
			.a4-paper {
			    width: 210mm;
			    min-width: 210mm;
			    height: 297mm;
			    min-height: 297mm;
			    margin: 0 auto;
			    background: #fff;
			    box-shadow:
			        0 2px 12px rgba(0,0,0,0.25);
			    position: relative;
			    padding: 15mm;
			}
			/* =========================================================
			   MOBILE
			   Keep A4 at FULL SIZE.
			   Do NOT shrink.
			========================================================= */
			@media (max-width: 600px) {
			    .paper-container {
			        padding: 10px;
			    }
			    .a4-paper {
			        margin-left: 0;
			        margin-right: 0;
			    }
			}
			/* =========================================================
			   PRINT
			========================================================= */
			@media print {
			    @page {
			        size: A4 portrait;
			        margin: 0;
			    }
			    html,
			    body {
			        background: #fff;
			    }
			    .top-bar {
			        display: none;
			    }
			    .paper-container {
			        padding: 0;
			        overflow: visible;
			    }
			    .a4-paper {
			        width: 210mm;
			        min-width: 210mm;
			        height: 297mm;
			        min-height: 297mm;
			        margin: 0;
			        box-shadow: none;
					padding: 5mm;
			    }
			}
		</style>
		<!-- =========================================================
     NDA CSS
========================================================= -->
		<link rel="stylesheet" href="../css/nda.css" />
	</head>
	<body>
		<!-- =======================================================
     TOP BAR
======================================================= -->
		<div class="top-bar">
			<button id="back" onclick="goBack()">← Back</button>
			<button id="print" onclick="window.print()">🖨 Print</button>
		</div>
		<!-- =======================================================
     A4 CONTAINER
======================================================= -->
		<div class="paper-container">
			<div class="a4-paper">
				<div id="printArea"></div>
			</div>
		</div>
		<script>
		
			/* =========================================================
			   BACK
			========================================================= */
			function goBack() {
			    history.back();
			}
			
function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}
			/* =========================================================
			   GENERATE NDA
			   TEMPORARY STATIC FORMAT ONLY
			   No data exchange with index.html yet.
			========================================================= */
			function generatePDF() {
				
				const params =
    new URLSearchParams(window.location.search);

const data =
    JSON.parse(
        params.get("data")
    );

const month = data.month;
const year = data.year;

			    const printArea =
			        document.getElementById("printArea");
			    if (!printArea) {
			        alert("printArea not found.");
			        return;
			    }
				
				const rows =
    data.employees
        .map((emp, index) => {

            return `

                <tr>

                    <td class="nda-sno">
					<strong>
                        ${index + 1}
					</strong>
                    </td>

                    <td class="nda-employee">
					<strong>
						${escapeHTML(emp.name || "")}
					</strong>
					<br>

                        <strong>
                            PF:
						</strong>
                        ${escapeHTML(emp.pe || "")}
                        <br>

                        <strong>
                            BU:
						</strong>
                            ${escapeHTML(emp.billUnit || "")}
                                
                            
                        

                    </td>

                    <td class="nda-desig">

                        ${escapeHTML(
                            emp.desig || ""
                        )}

                    </td>

                    <td class="nda-dates">
    ${escapeHTML(
        (emp.nhDate && emp.nhDate.length > 0)
            ? emp.nhDate.join(", ")
            : "---"
    )}
</td>

                </tr>

            `;

        })
        .join("");
		
			    printArea.innerHTML = `
			        <div class="nda-preview-page">
			            <!-- =============================================
			                 FROM
			            ============================================== -->
			            <div class="nda-letter-line">
							<strong>From,</strong><br>
    							${escapeHTML(data.depot || "")}
						</div>
    
			            <!-- =============================================
			                 TO
			            ============================================== -->
			            <div class="nda-letter-line">
			                <strong>To,</strong><br>
			                Sr. DPO, GUNTAKAL
			            </div>
			            <!-- =============================================
			                 SUBJECT
			            ============================================== -->
			            <div class="nda-subject">
			                <strong>
			                    Subject:
			                </strong>
			                Submission of National Holiday Allowance
			                for the month of ${month}, ${year}.
			            </div>
			            <!-- =============================================
			                 SALUTATION
			            ============================================== -->
			            <div class="nda-letter-salu">
			                Respected Sir,
			            </div>
			            <!-- =============================================
			                 INTRODUCTION
			            ============================================== -->
			            <div class="nda-letter-intro">
			                &ensp;&ensp;&emsp;&emsp;The Detail of the National Holiday Allowance
			                for the Month of ${month}, ${year}
			                of the Following Employee,
			                This is for Your Kind Attention.
			            </div>
			            <!-- =============================================
			                 NDA TABLE
			            ============================================== -->
			            <table class="nda-preview-table">
			                <thead>
			                    <tr>
			                        <th>
			                            SNo
			                        </th>
			                        <th>
			                            Name of the Employee
			                        </th>
			                        <th>
			                            Desg.
			                        </th>
			                        <th>
			                            Date on which National Holiday
			                        </th>
			                    </tr>
			                </thead>
			                <tbody>

    ${rows}

</tbody>
			            </table>
			            <!-- =============================================
			                 BOTTOM
			            ============================================== -->
			            <div class="nda-bottom">
			                <div>
			                    <strong>
			                        Date:
			                    </strong>
			                    <br>
			                    <strong>
			                        Place:
			                    </strong>
			                </div>
			                <div class="nda-signature">
  								<br><br><br>${escapeHTML(data.depot || "")}
							</div>
			            </div>
			        </div>
			    `;
			}
			/* =========================================================
			   AUTO GENERATE ON PAGE LOAD
			========================================================= */
			document.addEventListener(
			    "DOMContentLoaded",
			    generatePDF
			);
		</script>
	</body>
</html>
